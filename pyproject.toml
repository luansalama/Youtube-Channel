[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cuts-studio"
version = "0.1.0"
description = "Local deterministic harness for Twitch-to-YouTube cuts/highlights production (proposal-gated)."
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Cuts Studio"}]
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
youtube = [
  "google-api-python-client>=2.0",
  "google-auth-oauthlib>=1.0",
  "google-auth-httplib2>=0.2",
]

[project.scripts]
cstudio = "cstudio.cli:main"

[tool.setuptools]
packages = ["cstudio"]

[tool.setuptools.package-data]
cstudio = ["static/*.css", "static/*.js"]
