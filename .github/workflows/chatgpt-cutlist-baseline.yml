name: ChatGPT Cutlist Baseline

on:
  push:
    branches:
      - chatgpt/cutlist-workflow-20260911
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Maintain
        run: python -m cstudio --root . maintain | tee baseline-maintain.txt
      - name: Status
        run: python -m cstudio --root . status | tee baseline-status.txt
      - name: Test baseline
        shell: bash
        run: |
          set +e
          python -m pytest tests/ -q 2>&1 | tee baseline-tests.txt
          code=${PIPESTATUS[0]}
          echo "$code" > baseline-test-exit.txt
          echo "Baseline pytest exit code: $code"
          exit 0
      - name: Upload baseline logs
        uses: actions/upload-artifact@v4
        with:
          name: cutlist-baseline-logs
          path: |
            baseline-maintain.txt
            baseline-status.txt
            baseline-tests.txt
            baseline-test-exit.txt
